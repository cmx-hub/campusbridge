<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CampusBridge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="container nav-container">

            <a href="index.html" class="logo">
                <img src="campusbridge-logo.svg"
                     alt="CampusBridge logo"
                     class="logo-image">
                <span>CampusBridge</span>
            </a>

        </div>
    </header>

    <main>

        <section class="login-page">

            <div class="container login-layout">

                <div class="login-card">

                    <div class="login-card-header">

                        <h2 id="auth-title">Sign in</h2>

                        <p id="auth-description">
                            Access your CampusBridge student dashboard.
                        </p>

                    </div>

                    <form id="login-form" class="login-form">

                        <div class="form-group">
                            <label for="account-type">Sign in as</label>
                            <select id="account-type" name="account_type" required>
                                <option value="student" selected>Student</option>
                                <option value="organization">Organization</option>
                                <option value="institution">Institution</option>
                            </select>
                        </div>

                        <div class="form-group">

                            <label for="email">
                                Email address
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="you@example.com"
                                autocomplete="email"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <div class="password-field">
                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required
                                >
                                <button
                                    type="button"
                                    class="password-toggle"
                                    data-target="password"
                                    aria-label="Show password"
                                >
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"></path>
                                        <circle cx="12" cy="12" r="2.5"></circle>
                                    </svg>
                                </button>
                            </div>

                        </div>

                        <button type="submit" class="btn btn-primary">
                            Sign In
                        </button>

                        <div class="forgot-password-row">
                            <button
                                type="button"
                                id="forgot-password-button"
                                class="forgot-password-button"
                            >
                                Forgot password?
                            </button>
                        </div>

                        <p id="login-message"></p>

                    </form>

                    <form id="forgot-password-form" class="login-form" style="display: none;">
                        <div class="login-card-header">
                            <h2>Reset your password</h2>
                            <p>
                                Enter your CampusBridge email to receive a recovery code.
                            </p>
                        </div>

                        <div class="form-group">
                            <label for="forgot-email">Email</label>
                            <input
                                type="email"
                                id="forgot-email"
                                name="email"
                                placeholder="you@example.com"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Send Recovery Code
                        </button>

                        <div id="password-reset-fields" style="display: none;">
                            <div class="form-group">
                                <label for="recovery-code">Recovery Code</label>
                                <input
                                    type="text"
                                    id="recovery-code"
                                    name="recovery_code"
                                    inputmode="numeric"
                                    maxlength="6"
                                    placeholder="Enter 6-digit code"
                                >
                            </div>

                            <div class="form-group">
                                <label for="new-password">New Password</label>
                                <input
                                    type="password"
                                    id="new-password"
                                    name="new_password"
                                    minlength="8"
                                    placeholder="Enter your new password"
                                >
                            </div>

                            <button
                                type="button"
                                id="reset-password-button"
                                class="btn btn-primary"
                            >
                                Reset Password
                            </button>
                        </div>

                        <p id="forgot-password-message"></p>

                        <div class="auth-switch">
                            <span>Remember your password?</span>
                            <button
                                type="button"
                                id="back-to-login-button"
                                class="auth-switch-button"
                            >
                                Sign In
                            </button>
                        </div>
                    </form>

                    <form id="register-form" class="login-form" style="display: none;">

                        <div class="form-group">

                            <label for="register-name">
                                Full name
                            </label>

                            <input
                                type="text"
                                id="register-name"
                                name="name"
                                placeholder="Your full name"
                                autocomplete="name"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="register-email">
                                Email address
                            </label>

                            <input
                                type="email"
                                id="register-email"
                                name="email"
                                placeholder="you@example.com"
                                autocomplete="email"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="register-password">
                                Password
                            </label>

                            <div class="password-field">
                                <input
                                    type="password"
                                    id="register-password"
                                    name="password"
                                    placeholder="At least 8 characters"
                                    minlength="8"
                                    autocomplete="new-password"
                                    required
                                >
                                <button
                                    type="button"
                                    class="password-toggle"
                                    data-target="register-password"
                                    aria-label="Show password"
                                >
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"></path>
                                        <circle cx="12" cy="12" r="2.5"></circle>
                                    </svg>
                                </button>
                            </div>

                        </div>

                        <div class="form-group">
                            <label for="register-institution">Institution</label>
                            <input
                                type="text"
                                id="register-institution"
                                name="institution"
                                placeholder="Your university or institution"
                                autocomplete="organization"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="register-field-of-study">Field of study</label>
                            <input
                                type="text"
                                id="register-field-of-study"
                                name="field_of_study"
                                placeholder="e.g. Computer Engineering"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="register-level">Level</label>
                            <input
                                type="text"
                                id="register-level"
                                name="level"
                                placeholder="e.g. Bachelor 3"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="register-skills">Skills</label>
                            <input
                                type="text"
                                id="register-skills"
                                name="skills"
                                placeholder="e.g. Python, Networking, Research"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="register-interests">Interests</label>
                            <input
                                type="text"
                                id="register-interests"
                                name="interests"
                                placeholder="e.g. Cybersecurity, AI, Entrepreneurship"
                                required
                            >
                        </div>

                        <div class="form-group" style="margin: 18px 0;">
                            <label for="register-legal-consent" style="display:flex;align-items:flex-start;gap:10px;line-height:1.5;">
                                <input type="checkbox" id="register-legal-consent" name="legal_consent" required style="width:auto;min-width:16px;margin-top:4px;">
                                <span>I have read and agree to the
                                    <a href="privacy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
                                    and
                                    <a href="terms.html" target="_blank" rel="noopener noreferrer">Terms of Use</a>.
                                </span>
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Create Account
                        </button>

                        <p id="register-message"></p>

                    </form>

                    <div class="auth-switch">

                        <span id="auth-switch-text">
                            Don't have a CampusBridge account?
                        </span>

                        <button
                            type="button"
                            id="auth-switch-button"
                            class="auth-switch-button"
                        >
                            Create an account
                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <script src="login.js"></script>

</body>
</html>
